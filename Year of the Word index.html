<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Year of the Word</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+SC:wght@500;700;800&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem("yow-theme"),z=localStorage.getItem("yow-text");if(t&&t!=="auto")document.documentElement.dataset.theme=t;if(z&&z!=="normal")document.documentElement.dataset.text=z}catch(e){}</script>
<style>
:root{
  --bg:#E6E8EF; --surface:#FFFFFF; --surface2:#F3F4F8; --ink:#1A1E36; --muted:#5D6178;
  --gold:#94701F; --gold-soft:rgba(148,112,31,.14); --ruby:#8E2B2B; --lapis:#2F4F9A; --green:#2E6B45;
  --line:rgba(26,30,54,.14); --cell:#D3D6E0; --btn-ink:#FFFFFF;
  --land:#DCCDA8; --sea:#8FA9C4; --river:#5F84AD; --maptext:#4A3B22;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme="parchment"]){
    --bg:#11142A; --surface:#1A1F3D; --surface2:#222849; --ink:#EEE6D3; --muted:#A3A2B8;
    --gold:#D9B45F; --gold-soft:rgba(217,180,95,.14); --ruby:#D0564F; --lapis:#7E9BE0; --green:#5FB27F;
    --line:rgba(217,180,95,.2); --cell:#2C3258; --btn-ink:#16182C;
    --land:#3A3F63; --sea:#1C2A4C; --river:#5B7DB8; --maptext:#E6D9B8;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11142A; --surface:#1A1F3D; --surface2:#222849; --ink:#EEE6D3; --muted:#A3A2B8;
  --gold:#D9B45F; --gold-soft:rgba(217,180,95,.14); --ruby:#D0564F; --lapis:#7E9BE0; --green:#5FB27F;
  --line:rgba(217,180,95,.2); --cell:#2C3258; --btn-ink:#16182C;
  --land:#3A3F63; --sea:#1C2A4C; --river:#5B7DB8; --maptext:#E6D9B8;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Alegreya",Georgia,"Times New Roman",serif;font-size:1.125rem;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
img,svg{max-width:100%}

.wrap{max-width:620px;margin:0 auto;padding:16px 18px 120px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 14px}
.brand{font-family:"Alegreya SC",Georgia,serif;font-weight:800;font-size:1.25rem;letter-spacing:.02em;margin:0}
.me-chip{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;font-size:.95rem;color:var(--muted)}
.me-chip .av{width:36px;height:36px}

.archrow{display:flex;align-items:center;justify-content:center;gap:10px}
.archrow > button{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.4rem;line-height:1;color:var(--ink);padding:0}
.archrow > button:disabled{opacity:.3;cursor:default}
.arch{position:relative;margin:4px 0 0;width:min(240px,64vw);aspect-ratio:3/4;border-radius:999px 999px 14px 14px;
  background:radial-gradient(120% 80% at 50% 0%,var(--gold-soft),transparent 70%),var(--surface);
  border:1.5px solid var(--gold);box-shadow:inset 0 0 0 6px var(--surface),inset 0 0 0 7px var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.arch .word{font-family:"Alegreya SC",Georgia,serif;font-size:1.15rem;color:var(--muted);margin:0}
.arch .num{font-family:"Alegreya SC",Georgia,serif;font-weight:800;color:var(--gold);font-size:clamp(5rem,24vw,7rem);line-height:.9;margin:4px 0 6px}
.arch .of{font-size:.95rem;color:var(--muted);margin:0}
.arch .seal{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);background:var(--ruby);color:#fff;font-size:.85rem;padding:3px 12px;border-radius:999px;white-space:nowrap}

.summary{text-align:center;color:var(--muted);margin:10px auto 18px;max-width:36ch}
.summary strong{color:var(--ink)}
.actions{display:grid;gap:10px;margin-bottom:22px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:10px 18px;border-radius:12px;border:1.5px solid var(--gold);background:transparent;color:var(--ink);font-weight:500;text-decoration:none;font-size:1rem}
.btn.primary{background:var(--gold);color:var(--btn-ink);font-weight:700}
.btn.done{border-color:var(--line);color:var(--muted)}
.btn.sm{min-height:40px;padding:6px 14px;font-size:.92rem}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{flex:none}

.grid365{display:grid;grid-template-columns:repeat(auto-fill,minmax(9px,1fr));gap:3px;margin:0 0 26px}
.grid365 i{aspect-ratio:1;border-radius:2px;background:var(--cell)}
.grid365 i.on{background:var(--gold)}
.grid365 i.fz{background:var(--lapis);opacity:.6}
.grid365 i.cur{outline:1.5px solid var(--ruby);outline-offset:1px}

h2{font-family:"Alegreya SC",Georgia,serif;font-weight:700;font-size:1.35rem;margin:0 0 6px}
h3{font-family:"Alegreya SC",Georgia,serif;font-weight:700;font-size:1.08rem;margin:18px 0 6px}
.lede{color:var(--muted);margin:0 0 14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
.small{font-size:.88rem;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.linkbtn{background:none;border:0;padding:0;color:var(--lapis);text-decoration:underline;font-size:.92rem}
textarea,input[type=text]{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:1rem}
textarea{min-height:74px;resize:vertical}
label.l{display:block;font-weight:700;margin:10px 0 4px}
.notice{background:var(--gold-soft);border-radius:10px;padding:10px 12px;font-size:.92rem;margin:0 0 16px}

/* day at a glance */
.period{display:inline-block;font-size:.85rem;border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:1px 10px;margin:0 0 8px}
.readings{font-size:.92rem;color:var(--muted);margin:0 0 10px}
.recap{margin:0 0 14px}
.verse{margin:0 0 16px;padding:14px 16px;border-radius:12px;background:var(--gold-soft);border-left:3px solid var(--gold)}
.verse blockquote{margin:0;font-style:italic;font-size:1.12rem;line-height:1.5}
.verse cite{display:block;font-style:normal;font-weight:700;margin-top:6px;font-size:.92rem}
.verse p{margin:6px 0 0;font-size:.92rem;color:var(--muted)}
.map{border-radius:12px;overflow:hidden;border:1px solid var(--line);margin:0 0 8px;background:var(--sea)}
.map svg{display:block;width:100%;height:auto}

/* quiz */
.qz{margin:0 0 16px}
.qz p.qq{margin:0 0 6px;font-weight:500}
.opts{display:grid;gap:6px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px 12px;font-size:.98rem}
.opt[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}
.opt.right{border-color:var(--green);background:color-mix(in srgb,var(--green) 18%,transparent)}
.opt.wrong{border-color:var(--ruby);background:color-mix(in srgb,var(--ruby) 16%,transparent)}
.why{font-size:.9rem;color:var(--muted);margin:6px 0 0}
.score{font-family:"Alegreya SC",Georgia,serif;font-weight:800;font-size:1.3rem;color:var(--gold);margin:0 0 12px}

/* reflect */
.q{margin:0 0 14px}
.q p{margin:0 0 6px;font-weight:500}
.q .n{color:var(--gold);font-family:"Alegreya SC",Georgia,serif;font-weight:800;margin-right:6px}
.feedback{white-space:pre-wrap;background:var(--gold-soft);border-left:3px solid var(--gold);border-radius:6px;padding:12px 14px;margin-top:14px}

/* discussion */
.posts{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.post{display:flex;gap:10px;align-items:flex-start}
.post .av{width:38px;height:38px;flex:none}
.post .body{flex:1;min-width:0;background:var(--surface2);border-radius:4px 12px 12px 12px;padding:8px 12px}
.post .who{font-weight:700;font-size:.92rem;margin:0}
.post .who span{font-weight:400;color:var(--muted)}
.post .txt{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.post .bar{display:flex;gap:12px;align-items:center;margin-top:6px}
.react{background:none;border:1px solid var(--line);border-radius:999px;padding:1px 10px;font-size:.85rem;color:var(--muted)}
.react[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);background:var(--gold-soft)}
.post details{margin-top:4px}
.post summary{cursor:pointer;color:var(--lapis);font-size:.9rem}
.post dl{margin:6px 0 0}
.post dt{font-size:.88rem;color:var(--muted);margin-top:6px}
.post dd{margin:0}
.compose{display:flex;gap:8px;margin-top:12px;align-items:flex-end}
.compose textarea{min-height:46px}

/* fellowship */
.challenge{border:1.5px solid var(--gold)}
.goalbar{height:10px;border-radius:99px;background:var(--cell);overflow:hidden;margin:10px 0 6px}
.goalbar span{display:block;height:100%;background:linear-gradient(90deg,var(--ruby),var(--gold))}
.mini{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:4px;font-size:.92rem}
.mini li{display:flex;justify-content:space-between;gap:10px}
.board{display:grid;gap:10px;list-style:none;margin:0;padding:0}
.card{position:relative;overflow:hidden;border-radius:14px;color:#fff;min-height:84px;display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;width:100%;border:0;text-align:left}
.card::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.62),rgba(0,0,0,.15) 78%)}
.card > *{position:relative}
.card .rank{font-family:"Alegreya SC",Georgia,serif;font-weight:800;font-size:1.3rem;width:1.5em;text-align:center;opacity:.9}
.card .av{width:58px;height:58px;flex:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.card .who{flex:1;min-width:0}
.card .nm{font-weight:700;font-size:1.06rem;margin:0;text-shadow:0 1px 3px rgba(0,0,0,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .st{margin:0;font-size:.86rem;opacity:.95;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.card .pbar{height:4px;background:rgba(255,255,255,.25);border-radius:9px;margin-top:6px;overflow:hidden}
.card .pbar span{display:block;height:100%;background:#F2D27C}
.card .em{width:40px;height:46px;flex:none}
.card.you{box-shadow:0 0 0 2px var(--gold)}
.cheerbar{display:flex;flex-wrap:wrap;gap:6px;padding:8px 4px 2px}
.cheerin{background:var(--gold-soft);border-radius:12px;padding:10px 14px;margin:0 0 16px}
.cheerin p{margin:0}

/* calling cards */
.cc-vigil{background:radial-gradient(circle at 85% 30%,#3a4a9a 0 2px,transparent 3px) 0 0/38px 30px,linear-gradient(135deg,#202a62,#0c1027)}
.cc-desert{background:linear-gradient(170deg,#e3a65f 0 45%,#b46a35 45% 62%,#7b4425 62%)}
.cc-rose{background:radial-gradient(circle at 82% 50%,#f1d27a 0 6%,transparent 7%),repeating-conic-gradient(from 0deg at 82% 50%,#8d1f3f 0 15deg,#2c4ea6 15deg 30deg)}
.cc-jubilee{background:linear-gradient(115deg,#7b5d16,#e9c96b 45%,#a47d22 70%,#5c4410)}
.cc-kingdom{background:linear-gradient(#e2bd5e,#e2bd5e) 0 50%/100% 4px no-repeat,linear-gradient(90deg,#6c1b1b 0 50%,#8b2727 50%)}
.cc-prophet{background:radial-gradient(ellipse 80% 120% at 85% 120%,#ffcf5a,#e0662a 35%,#6b1916 65%,#200a0c)}
.cc-cathedral{background:repeating-linear-gradient(90deg,#26305e 0 14px,#1b2349 14px 18px)}
.cc-upper{background:radial-gradient(circle at 82% 34%,#ffe2a0 0 2.5%,rgba(255,190,90,.35) 6%,transparent 12%),radial-gradient(circle at 70% 40%,#ffe2a0 0 2%,rgba(255,190,90,.3) 5%,transparent 10%),linear-gradient(160deg,#5a2e1a,#2a140c)}
.cc-scholar{background:repeating-linear-gradient(0deg,#2c5a3e 0 3px,#24503a 3px 22px),linear-gradient(#2c5a3e,#1d3d2c)}
.cc-jerusalem{background:radial-gradient(circle at 80% 40%,#fff6d4 0 18%,transparent 45%),linear-gradient(180deg,#5f8fc2,#c79a3d)}

/* armory */
.hero-me{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.hero-me .av{width:96px;height:96px;flex:none}
.hero-me h2{margin:0}
.rankbox{margin:0 0 24px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:0 0 28px;padding:0;list-style:none}
.item{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0;text-align:left;overflow:hidden;width:100%;display:block;height:100%}
.item .sw{height:54px}
.item .tx{padding:8px 10px 10px}
.item .t{font-weight:700;margin:0;font-size:.98rem}
.item .r{margin:0;font-size:.82rem;color:var(--muted)}
.item.locked{opacity:.62}
.item.locked .sw{filter:grayscale(.55) brightness(.85)}
.item.eq{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.embl{display:flex;align-items:center;gap:10px;padding:10px}
.embl svg{width:38px;height:44px;flex:none}

/* prayer */
.prayer .body{border-radius:12px}
.prayer.answered .txt{color:var(--muted)}
.tag{display:inline-block;font-size:.8rem;background:var(--green);color:#fff;border-radius:999px;padding:0 8px;margin-left:6px;vertical-align:1px}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{background:none;border:0;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:.82rem}
nav.tabs button[aria-current="page"]{color:var(--gold);font-weight:700}
nav.tabs svg{width:24px;height:24px}

.modal{position:fixed;inset:0;z-index:40;background:rgba(8,10,24,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:620px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet h2{font-size:1.5rem}
.pick{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:8px 0 16px}
.pick button{background:var(--surface2);border:1.5px solid transparent;border-radius:12px;padding:6px 2px 4px;font-size:.76rem;color:var(--ink)}
.pick button[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}
.pick .av{width:100%;aspect-ratio:1}
.swatches{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 16px}
.swatches button{width:36px;height:36px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--gold)}
.preview{display:flex;justify-content:center;margin:4px 0 6px}
.preview .av{width:110px;height:110px}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;max-width:90vw;font-weight:500;box-shadow:0 6px 24px rgba(0,0,0,.3)}
.loading{text-align:center;color:var(--muted);padding:80px 0}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:pop .35s ease-out}
  @keyframes pop{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
}

/* parchment theme + text size */
:root[data-theme="parchment"]{
  --bg:#E9DCBF; --surface:#F6EEDB; --surface2:#EFE3C8; --ink:#3A2814; --muted:#6F5A3C;
  --gold:#8A5A12; --gold-soft:rgba(138,90,18,.14); --ruby:#8B2318; --lapis:#2C4A80; --green:#3D6B2E;
  --line:rgba(58,40,20,.2); --cell:#DCCDA9; --btn-ink:#FFF8E8;
  --land:#E4CF9E; --sea:#9FB4B6; --river:#5E8297; --maptext:#4A3216;
  color-scheme:light;
}
:root[data-theme="parchment"] body{background-image:radial-gradient(rgba(120,80,30,.07) 1px,transparent 1px);background-size:7px 7px}
html{font-size:100%}
:root[data-text="large"]{font-size:112.5%}
:root[data-text="xl"]{font-size:125%}
.hdr-r{display:flex;align-items:center;gap:12px}
.brand{white-space:nowrap;font-size:clamp(1.05rem,5.2vw,1.25rem)}
.me-chip span{white-space:nowrap}
@media (max-width:460px){.me-chip span{display:none}}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;padding:0;color:var(--ink);font-family:"Alegreya SC",Georgia,serif;font-weight:700;font-size:.95rem}

/* stained glass arch */
.arch.glass{border:3px solid var(--gold);background:#0d0f22;box-shadow:0 8px 28px rgba(0,0,0,.28)}
.glasswrap{position:absolute;inset:0;border-radius:inherit;overflow:hidden}
.glasswrap svg{width:100%;height:100%;display:block}
.glasswrap::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 5px rgba(20,17,12,.85),inset 0 0 0 7px rgba(226,189,94,.55)}
.arch-txt{position:absolute;left:0;right:0;top:59.4%;transform:translateY(-50%);text-align:center;z-index:1}
.arch.glass .word{color:#E9DDBB;margin:0;font-size:1rem}
.arch.glass .num{color:#F2D27C;font-size:clamp(3.4rem,17vw,5rem);margin:0;line-height:.95;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.plaque{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;z-index:1;margin:0;background:rgba(13,15,34,.82);color:#F3E6C2;border:1px solid var(--pc);border-radius:6px;padding:1px 10px;font-size:.8rem;white-space:nowrap;font-family:"Alegreya SC",Georgia,serif}
.arch .seal{z-index:2}
.swipehint{text-align:center;font-size:.82rem;color:var(--muted);margin:22px 0 0}
@media (prefers-reduced-motion:no-preference){
  .arch.in-r{animation:inr .32s ease-out}
  .arch.in-l{animation:inl .32s ease-out}
  @keyframes inr{from{transform:translateX(46px);opacity:.2}to{transform:none;opacity:1}}
  @keyframes inl{from{transform:translateX(-46px);opacity:.2}to{transform:none;opacity:1}}
}

/* who finished today */
.strip{margin:0 0 14px}
.strip-cap{margin:0 0 6px;font-size:.9rem;color:var(--muted)}
.strip-cap strong{color:var(--ink)}
.strip-row{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:none}
.strip-row::-webkit-scrollbar{display:none}
.strip-p{flex:none;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px;width:58px;font-size:.78rem;color:var(--muted)}
.strip-p .ava{position:relative;width:46px;height:46px}
.strip-p .av{width:46px;height:46px;border-radius:50%;opacity:.45;filter:grayscale(.7)}
.strip-p.done .av{opacity:1;filter:none;box-shadow:0 0 0 2.5px var(--gold)}
.strip-p.done{color:var(--ink)}
.strip-p .ck{position:absolute;right:-3px;bottom:-3px;width:18px;height:18px;border-radius:50%;background:var(--green);color:#fff;font-size:11px;line-height:18px;text-align:center;border:2px solid var(--bg);font-weight:700}
.strip-p span.nm{max-width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* timeline */
.timeline{margin:0 0 16px}
.tl-row{position:relative;height:30px;margin:0 13px}
.tl-dot{position:absolute;bottom:3px;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;box-shadow:0 0 0 2px var(--bg);background:none;border:0;padding:0}
.tl-dot .av{width:22px;height:22px;display:block}
.tl-dot.me{z-index:2;width:28px;height:28px;bottom:1px;box-shadow:0 0 0 2px var(--gold)}
.tl-dot.me .av{width:28px;height:28px}
.tl-bar{position:relative;display:flex;margin:0 13px}
.tl-seg{border:0;height:26px;padding:8px 0;background-clip:content-box;opacity:.5;min-width:3px;cursor:pointer}
.tl-seg.on{opacity:1}
.tl-seg:first-child{border-radius:99px 0 0 99px}
.tl-seg:nth-child(12){border-radius:0 99px 99px 0}
.tl-view{position:absolute;top:3px;width:3px;height:20px;background:var(--ink);border-radius:2px;transform:translateX(-50%);pointer-events:none}
.tl-cap{margin:4px 0 0;font-size:.9rem;color:var(--muted);text-align:center}
.tl-cap strong{color:var(--ink)}

/* friend profile + display sheets */
.pf-head{min-height:110px}
.pf-head .av{width:78px!important;height:78px!important}
.pf-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:14px 0}
.pf-stats div{background:var(--surface2);border-radius:10px;padding:8px 10px}
.pf-stats strong{display:block;font-size:1.2rem}
.pf-stats span{font-size:.8rem;color:var(--muted)}
.pf-ems{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.pf-ems svg{width:34px;height:40px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 16px}
.seg.three{grid-template-columns:repeat(3,1fr)}
.seg button{padding:10px 4px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface2);font-size:.9rem;display:flex;flex-direction:column;align-items:center;gap:4px}
.seg button[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft);font-weight:700}
.seg .sw{width:24px;height:24px;border-radius:50%;border:1px solid rgba(0,0,0,.2)}

/* celebration */
.celebrate{position:fixed;inset:0;z-index:60;pointer-events:none;display:flex;align-items:center;justify-content:center}
.cel-card{background:var(--surface);border:2px solid var(--gold);border-radius:20px;padding:18px 28px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.35);opacity:0;animation:celfade 1.8s ease forwards}
.cel-day{font-family:"Alegreya SC",Georgia,serif;font-weight:800;font-size:2.4rem;color:var(--gold);margin:0;line-height:1}
.cel-msg{margin:6px 0 0}
.celebrate i{position:absolute;left:50%;top:50%;width:9px;height:13px;border-radius:2px;background:var(--c);opacity:0;font-style:normal}
.celebrate i.g{background:none;color:var(--c);font-size:20px;width:auto;height:auto}
@keyframes celfade{0%{opacity:0}12%{opacity:1}80%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:no-preference){
  .cel-card{animation:celpop 2.1s ease forwards}
  .celebrate i{animation:burst 1.7s cubic-bezier(.15,.7,.3,1) var(--d) forwards}
  @keyframes celpop{0%{opacity:0;transform:scale(.6)}14%{opacity:1;transform:scale(1.06)}24%{transform:scale(1)}82%{opacity:1}100%{opacity:0}}
  @keyframes burst{0%{opacity:1;transform:translate(-50%,-50%) rotate(0)}75%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(var(--r))}}
}

/* setup */
.setup{border:1.5px solid var(--gold)}
.setup h2{font-size:1.2rem}
.steps{margin:0 0 14px;padding-left:1.3em}
.steps li{margin:0 0 8px}
.linkbox{display:flex;gap:8px;margin:6px 0 4px}
.linkbox input{font-size:.85rem}
.ostag{display:inline-block;font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:0 8px;margin-left:6px;color:var(--muted);vertical-align:2px}

.catchup{border-left:4px solid var(--lapis)}
.catchup h2{font-size:1.2rem}
.recap-text{white-space:pre-wrap;background:var(--surface2);border-radius:10px;padding:12px 14px;font-size:.95rem;margin:10px 0 12px;line-height:1.5}
.seg.two{grid-template-columns:1fr 1fr;margin:8px 0 0}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin:10px 0 14px}
.checks label{display:flex;gap:6px;align-items:center;background:var(--surface2);border-radius:10px;padding:8px 10px;font-size:.95rem}
.checks input{width:18px;height:18px;accent-color:var(--gold)}

/* tablet + desktop layouts */
.tcol-a>*:last-child,.tcol-b>*:last-child{margin-bottom:0}
@media (min-width:720px){
  .wrap{max-width:760px;padding-left:28px;padding-right:28px}
  .items{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
}
@media (min-width:1000px){
  .wrap{max-width:1180px;padding:20px 36px 110px}
  .tgrid{display:grid;grid-template-columns:minmax(360px,430px) minmax(0,1fr);gap:36px;align-items:start}
  .fgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;align-items:start}
  .narrow{max-width:720px;margin:0 auto}
  .tcol-b .panel{padding:22px 26px}
  .opts{grid-template-columns:1fr 1fr}
  .modal{align-items:center}
  .sheet{max-width:600px;border-radius:20px;padding-bottom:24px;max-height:88%}
  nav.tabs .in{max-width:560px}
  .toast{bottom:96px}
}
@media (hover:hover){
  .btn:hover{filter:brightness(1.06)}
  .card:hover{transform:translateY(-1px)}
  .tl-seg:hover{opacity:.85}
  .strip-p:hover .av{opacity:.8}
}
</style>
</head>

  </div>
</nav>
<script>
"use strict";
/* ---------- constants ---------- */

const CARDS = [

  {id:"desert",name:"Desert Road",req:"Finish 14 days",test:s=>s.done>=14},

  {id:"scholar",name:"Scribe's Desk",req:"Get 3 perfect quizzes",test:s=>s.perfects>=3},
  {id:"jubilee",name:"Jubilee Gold",req:"Reach a 30-day streak",test:s=>s.best>=30},

  {id:"prophet",name:"Prophet's Fire",req:"Finish 150 days",test:s=>s.done>=150},

const EMBLEMS = [
  {id:"first",name:"First Light",glyph:"✝",req:"Finish Day 1",test:s=>s.done>=1,c:"#2F4F9A"},
  {id:"s3",name:"Third Day",glyph:"III",req:"3-day streak",test:s=>s.best>=3,c:"#2E6B45"},

  {id:"sharp",name:"Sharp Mind",glyph:"5/5",req:"Get a perfect quiz",test:s=>s.perfects>=1,c:"#2E6B45"},
  {id:"s7",name:"Sabbath Keeper",glyph:"VII",req:"7-day streak",test:s=>s.best>=7,c:"#6A3E8C"},
  {id:"team",name:"Fellowship",glyph:"⚔",req:"Win a weekly team challenge",test:s=>s.wins>=1,c:"#A32626"},
  {id:"cheer",name:"Encourager",glyph:"♥",req:"Send 10 encouragements",test:s=>s.cheers>=10,c:"#8E2B5A"},
  {id:"pray",name:"Intercessor",glyph:"✦",req:"Pray for 10 requests",test:s=>s.prayed>=10,c:"#2F4F9A"},
  {id:"d40",name:"Forty Days",glyph:"XL",req:"Finish 40 days",test:s=>s.done>=40,c:"#A32626"},
  {id:"s30",name:"Faithful Month",glyph:"✠",req:"30-day streak",test:s=>s.best>=30,c:"#A32626"},
  {id:"d100",name:"Centurion",glyph:"C",req:"Finish 100 days",test:s=>s.done>=100,c:"#1E1E26"},
  {id:"half",name:"Halfway Home",glyph:"½",req:"Finish 183 days",test:s=>s.done>=183,c:"#2F4F9A"},
  {id:"s100",name:"Unbroken",glyph:"☩",req:"100-day streak",test:s=>s.best>=100,c:"#6A3E8C"},
  {id:"all",name:"Alpha and Omega",glyph:"ΑΩ",req:"Finish all 365 days",test:s=>s.done>=365,c:"#94701F"}
];
const CHALLENGES = [
  {t:"Finish 6 episodes each",unit:"episodes",goal:6,f:a=>a.ep},
  {t:"Score 30 quiz points each",unit:"points",goal:30,f:a=>a.qp},
  {t:"Write 3 reflections each",unit:"reflections",goal:3,f:a=>a.rf},
  {t:"Show up on 5 different days each",unit:"days",goal:5,f:a=>a.ad}
];

/* ---------- state ---------- */
const S = {db:null,user:null,sample:null,uid:null,local:false,me:null,players:{},tab:"today",viewDay:null,readOnly:false,booted:false,
  day:{n:null,doc:undefined,comments:[],answers:{},rx:[],unsubs:[]}, journal:{}, prayers:[], prayRx:[], cheers:[], quizSel:{},
  cheerOpen:null, redoDay:null, busy:{}, winPending:null, frozeChecked:false};

/* ---------- utils ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const dstr=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>dstr(new Date());
function parseD(ds){const [y,m,d]=ds.split("-").map(Number);return new Date(y,m-1,d)}
function shift(ds,n){const x=parseD(ds);x.setDate(x.getDate()+n);return dstr(x)}
function weekStart(ds){const x=parseD(ds);const wd=(x.getDay()+6)%7;x.setDate(x.getDate()-wd);return dstr(x)}
function inWeek(ds,ws){return ds>=ws&&ds<=shift(ws,6)}
function ago(t){const s=(Date.now()-t)/1000;if(s<60)return"just now";if(s<3600)return Math.floor(s/60)+"m ago";if(s<86400)return Math.floor(s/3600)+"h ago";return Math.floor(s/86400)+"d ago"}
function ytLink(n){return"https://www.youtube.com/results?search_query="+encodeURIComponent("Bible in a Year Day "+n+" Fr. Mike Schmitz 2026")}
function releaseDate(n){return new Date(2026,0,n)}
function episodeUrl(n){return releaseDate(n)<=new Date()?"https://bibleinayear.fireside.fm/day-"+n+"-2026":null}
const YT_RE=/^https?:\/\/(www\.|m\.)?(youtube\.com\/(watch\?(.*&)?v=|live\/|shorts\/)|youtu\.be\/)[\w-]{11}/;
function lsGet(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const nameOf=uid=>(S.players[uid]&&S.players[uid].name)||"Someone";
const pl=(n,w)=>n+" "+w+(n===1?"":"s");

function currentStreak(dates){
  const set=new Set(dates||[]);let d=today();
  if(!set.has(d))d=shift(d,-1);
  let n=0;while(set.has(d)){n++;d=shift(d,-1)}
  return n;
}
function longestRun(dates){
  const arr=[...new Set(dates||[])].sort();let best=0,run=0,prev=null;
  for(const d of arr){run=(prev&&shift(prev,1)===d)?run+1:1;best=Math.max(best,run);prev=d}
  return best;
}
function stats(p){
  const all=[...(p.dates||[]),...(p.frozen||[])];
  const done=(p.completed||[]).length, streak=currentStreak(all);
  const best=Math.max(p.best||0,longestRun(all),streak);
  const refl=(p.reflected||[]).length;
  let qp=0,perfects=0;const q=p.quiz||{};for(const k in q){qp+=(q[k].s||0)*2;if(q[k].s===5)perfects++}
  const wins=(p.wins||[]).length;
  const xp=done*10+refl*5+qp+wins*25;
  return {done,streak,best,refl,qp,perfects,wins,xp,cheers:p.cheersSent||0,prayed:p.prayed||0,freezes:p.freezes||0};
}
function rankOf(xp){let i=0;for(let k=0;k<RANKS.length;k++)if(xp>=RANKS[k][0])i=k;return{name:RANKS[i][1],min:RANKS[i][0],next:RANKS[i+1]||null}}
function nextDay(p){const set=new Set(p.completed||[]);for(let i=1;i<=TOTAL;i++)if(!set.has(i))return i;return TOTAL}
function unlocked(p){const s=stats(p);return{cards:CARDS.filter(c=>c.test(s)).map(c=>c.id),emblems:EMBLEMS.filter(e=>e.test(s)).map(e=>e.id)}}
function weekActivity(p,ws){
  const ep=Object.values(p.doneOn||{}).filter(d=>inWeek(d,ws)).length;
  const rf=Object.values(p.reflOn||{}).filter(d=>inWeek(d,ws)).length;
  let qp=0;const q=p.quiz||{};for(const k in q)if(q[k].d&&inWeek(q[k].d,ws))qp+=(q[k].s||0)*2;
  const ad=(p.dates||[]).filter(d=>inWeek(d,ws)).length;
  return{ep,rf,qp,ad};
}
function currentChallenge(){return challengeFor(weekStart(today()))}
function challengeFor(ws){
  const idx=Math.floor(Math.round(parseD(ws).getTime()/864e5)/7)%CHALLENGES.length;
  const ch=CHALLENGES[(idx+CHALLENGES.length)%CHALLENGES.length];
  const members=Object.entries(S.players).filter(([,p])=>p&&p.name);
  const per=members.map(([id,p])=>({id,p,v:ch.f(weekActivity(p,ws))}));
  const prog=per.length?per.reduce((t,x)=>t+Math.min(x.v,ch.goal),0)/(ch.goal*per.length):0;
  return{ws,ch,per,prog};
}

let toastQ=[],toastOn=false;
function toast(msg){if(toastQ.length<4)toastQ.push(msg);if(!toastOn)nextToast()}
function nextToast(){
  const msg=toastQ.shift();if(!msg){toastOn=false;return}toastOn=true;
  const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=msg;
  document.body.appendChild(t);setTimeout(()=>{t.remove();nextToast()},toastQ.length?1700:2600);
}
/* ---------- avatars ---------- */
function face(skin,cy=36){

  <circle cx="35.8" cy="${cy-1}" r="1.4" fill="#2a1d14"/><circle cx="44.2" cy="${cy-1}" r="1.4" fill="#2a1d14"/>
  <path d="M36.5 ${cy+4.5}q3.5 2.4 7 0" stroke="#7a3d2c" stroke-width="1.3" fill="none" stroke-linecap="round"/>`;
}

  } else if(k==="friar"){

    <path d="M39 60h2v12h-2z M35.5 63.5h9v2h-9z" fill="#c9a050"/>

  } else if(k==="priest"){
    body=`<path d="M8 80c2-18 15-26 32-26s30 8 32 26z" fill="#1d1d26"/>
    <path d="M30 56l-4 24h6l4-23zM50 56l4 24h-6l-4-23z" fill="${c}"/>
    <rect x="35" y="51" width="10" height="5" rx="1.5" fill="#fff"/>

  } else if(k==="shepherd"){
    body=`<path d="M8 80c2-18 15-26 32-26s30 8 32 26z" fill="${c}"/>
    <path d="M66 80V30c0-6 8-6 8 0" stroke="#7a5230" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M22 57c-3-23 5-37 18-37s21 14 18 37c-5-3-11-4-18-4s-13 1-18 4z" fill="#e8dcc0"/>
    ${face(skin,37)}
    <path d="M27 26q13-6 26 0" stroke="${c}" stroke-width="3.2" fill="none"/>`;
  } else if(k==="fisher"){
    body=`<path d="M8 80c2-18 15-26 32-26s30 8 32 26z" fill="#4f5866"/>
    <path d="M32 67q8-6 16 0q-8 6-16 0zm16 0l5-3.5v7z" fill="none" stroke="#f1ede4" stroke-width="1.7" stroke-linejoin="round"/>
    ${face(skin,37)}
    <path d="M30.5 40c1 7 4.5 10.5 9.5 10.5S48.5 47 49.5 40c-2 2-5 3-9.5 3s-7.5-1-9.5-3z" fill="#6b4a2e"/>

function placeCoords(pl){
  const key=String(pl.name||"").toLowerCase().replace(/^the\s+/,"").replace(/\s*\(.*\)\s*/,"").trim();
  if(PLACES[key])return PLACES[key];
  for(const k in PLACES)if(key.includes(k))return PLACES[k];
  const lo=+pl.lon,la=+pl.lat;return isFinite(lo)&&isFinite(la)?[lo,la]:null;
}
function mapSVG(places,journey){
  const lbl=(x,y,t,o="")=>`<text x="${x}" y="${y}" ${o} fill="var(--maptext)" font-size="9" font-style="italic" opacity=".7" text-anchor="middle">${t}</text>`;
  const ps=(places||[]).map(p=>({p,c:placeCoords(p)})).filter(x=>x.c);
  let marks="",route="";
  const XY=ps.map(({p,c})=>{let x=PX(c[0]),y=PY(c[1]),off=false;
    if(x<6){x=6;off=true}if(x>MAP.w-6){x=MAP.w-6;off=true}if(y<6){y=6;off=true}if(y>MAP.h-6){y=MAP.h-6;off=true}return{p,x,y,off}});
  if(journey&&XY.length>1)route=`<polyline points="${XY.map(a=>a.x+","+a.y).join(" ")}" fill="none" stroke="var(--ruby)" stroke-width="2" stroke-dasharray="5 4"/>`;
  const boxes=[];
  XY.forEach((a,i)=>{
    const label=String(a.p.name).replace(/\s*\(.*$/,"")+(a.off?" (off map)":"");
    const w=label.length*6.6,anchor=a.x>MAP.w-w/2-6?"end":a.x<w/2+6?"start":"middle";
    const tx=anchor==="end"?a.x-8:anchor==="start"?a.x+8:a.x;
    const x0=anchor==="end"?tx-w:anchor==="start"?tx:tx-w/2;
    let ty=a.y<30?a.y+18:a.y-10;
    const hit=y=>boxes.some(b=>x0<b[0]+b[2]&&x0+w>b[0]&&Math.abs(y-b[1])<14);
    if(hit(ty))ty=a.y+20;if(hit(ty))ty=a.y-26;
    boxes.push([x0,ty,w]);a.label=label;
    marks+=`<circle cx="${a.x}" cy="${a.y}" r="${i===0?6:4.5}" fill="var(--ruby)" stroke="#fff" stroke-width="2"/>
    <text x="${tx}" y="${ty}" text-anchor="${anchor}" font-size="12" font-weight="700" fill="var(--maptext)" stroke="var(--land)" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">${esc(a.label)}</text>`;
  });
  return `<svg viewBox="0 0 ${MAP.w} ${MAP.h}" role="img" aria-label="Map showing ${esc(ps.map(x=>x.p.name).join(", "))}" font-family="Alegreya,Georgia,serif">

  <circle cx="${PX(28)}" cy="${PY(36.2)}" r="2.5" fill="var(--land)"/>
  <polyline points="${pts(NILE)}" fill="none" stroke="var(--river)" stroke-width="1.6"/>
  <polyline points="${pts(EUPH)}" fill="none" stroke="var(--river)" stroke-width="1.6"/>
  <polyline points="${pts(TIGRIS)}" fill="none" stroke="var(--river)" stroke-width="1.6"/>

/* ---------- writes ---------- */
async function savePlayer(patch){
  const before=unlocked(S.me),rb=rankOf(stats(S.me).xp).name;
  const next={...S.me,...patch,updated:Date.now()};
  next.best=stats(next).best;
  S.me=next;S.players[S.uid]=next;
  const after=unlocked(next),ra=rankOf(stats(next).xp).name;
  if(ra!==rb)toast("You've risen to "+ra+"!");
  after.cards.filter(x=>!before.cards.includes(x)).forEach(id=>toast("New calling card: "+CARDS.find(c=>c.id===id).name));
  after.emblems.filter(x=>!before.emblems.includes(x)).forEach(id=>toast("New emblem: "+EMBLEMS.find(e=>e.id===id).name));
  render();
  if(S.local){lsSet("yow-me",next);return true}
  try{await S.db.doc("players/"+S.uid).set(next);return true}
  catch(e){return writeFail(e,()=>S.db.doc("players/"+S.uid).set(S.me))}
}
function writeFail(e,retry){
  if(e&&e.code==="invalid_argument"){S.readOnly=true;render();toast("This copy is view-only for you, so that wasn't saved.")}
  else if(e&&e.code==="unavailable"&&retry){setTimeout(()=>retry().catch(()=>{}),800+Math.random()*800)}
  else if(e&&e.code==="quota_exceeded"){toast("The fellowship's storage is full. Ask the owner to clear old prayer requests.")}
  else toast("Couldn't save just now. Try again in a moment.");
  return false;
}
async function dbTry(fn){if(!S.db)return false;try{await fn();return true}catch(e){return writeFail(e)}}
async function saveJournal(n,data){
  S.journal[n]=data;
  if(S.local)return lsSet("yow-j-"+n,data);
  try{await S.db.collection("data/users/"+S.uid).doc("d"+n).set(data)}catch(e){}
}
async function saveDayDoc(n,data){
  if(S.local){lsSet("yow-day-"+n,data);if(S.day.n===n)S.day.doc=data;return render()}
  if(S.day.n===n)S.day.doc=data;
  await dbTry(()=>S.db.doc("days/"+n).set(data));
}

/* ---------- live data ---------- */
let rq=false;
function scheduleRender(){if(rq)return;rq=true;requestAnimationFrame(()=>{rq=false;render()})}
function subscribeDay(n){
  if(S.day.n===n)return;
  S.day.unsubs.forEach(u=>{try{u()}catch(e){}});
  S.day={n,doc:undefined,comments:[],answers:{},rx:[],unsubs:[]};
  if(S.journal[n]===undefined){
    S.journal[n]=null;
    if(S.local)S.journal[n]=lsGet("yow-j-"+n);
    else S.db.collection("data/users/"+S.uid).doc("d"+n).get().then(j=>{S.journal[n]=j.exists?{...j.data()}:{};scheduleRender()}).catch(()=>{S.journal[n]={}});
  }
  if(S.local){S.day.doc=lsGet("yow-day-"+n);return}
  const db=S.db,mine=S.day;
  mine.unsubs.push(db.doc("days/"+n).onSnapshot(d=>{mine.doc=d.exists?d.data():null;scheduleRender()},()=>{mine.doc=null;scheduleRender()}));
  mine.unsubs.push(db.collection("days/"+n+"/comments").orderBy("at","asc").limit(200).onSnapshot(s=>{mine.comments=s.docs.map(d=>({id:d.id,...d.data()}));scheduleRender()},()=>{}));
  mine.unsubs.push(db.collection("days/"+n+"/answers").onSnapshot(s=>{const a={};s.docs.forEach(d=>a[d.id]=d.data());mine.answers=a;scheduleRender()},()=>{}));
  mine.unsubs.push(db.collection("reactions").where("scope","==","d"+n).onSnapshot(s=>{mine.rx=s.docs.map(d=>({id:d.id,...d.data()}));scheduleRender()},()=>{}));
}
function rxFor(list,target){return list.filter(r=>r.target===target)}
async function toggleReact(scope,target,list){
  const id=target+"~"+S.uid,has=list.some(r=>r.id===id);
  return dbTry(()=>has?S.db.collection("reactions").doc(id).delete():S.db.collection("reactions").doc(id).set({scope,target,from:S.uid,at:Date.now()})).then(ok=>ok&&!has);
}

/* ---------- streak freezes ---------- */
function applyFreezes(){
  if(S.frozeChecked||!S.me)return;S.frozeChecked=true;
  const p=S.me,fz=p.freezes||0;if(!fz||!(p.dates||[]).length)return;
  const set=new Set([...(p.dates||[]),...(p.frozen||[])]);
  if(set.has(today()))return;
  let d=shift(today(),-1);const miss=[];
  while(!set.has(d)&&miss.length<=fz){miss.push(d);d=shift(d,-1)}
  if(miss.length&&miss.length<=fz&&set.has(d)){
    savePlayer({frozen:[...(p.frozen||[]),...miss],freezes:fz-miss.length});
    toast(miss.length===1?"A streak freeze covered yesterday. Your streak is safe.":"Streak freezes covered "+miss.length+" missed days.");
  }
}

/* ---------- render ---------- */
function render(){
  const v=$("#view");if(!S.booted)return;
  if(!S.me){v.innerHTML="";$("#tabs").hidden=true;$("#meChip").hidden=true;openProfile(true);return}
  if($(".modal")&&!S.me.name)return;
  $("#tabs").hidden=false;
  const chip=$("#meChip");chip.hidden=false;
  const st=stats(S.me);
  chip.innerHTML=`<span>${streakTxt(st.streak)}</span>${avatar(S.me)}`;
  chip.setAttribute("aria-label","Edit your profile");
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===S.tab?"page":"false"));
  // keep anything being typed
  const keep={};let focusKey=null,sel=null;
  document.querySelectorAll("[data-keep]").forEach(el=>{keep[el.dataset.keep]=el.value;if(el===document.activeElement){focusKey=el.dataset.keep;sel=[el.selectionStart,el.selectionEnd]}});
  const html=S.tab==="today"?todayHTML():S.tab==="fellowship"?fellowshipHTML():S.tab==="prayer"?prayerHTML():armoryHTML();
  v.innerHTML=html;
  document.querySelectorAll("[data-keep]").forEach(el=>{const k=el.dataset.keep;if(k in keep)el.value=keep[k];if(k===focusKey){el.focus();try{el.setSelectionRange(sel[0],sel[1])}catch(e){}}});
  bindView();
}

  all("[data-delp]",b=>{if(confirmDelete())dbTry(()=>S.db.doc("prayers/"+b.dataset.delp).delete())});

function markDone(){
  const n=S.viewDay,p=S.me,t=today();
  const completed=[...new Set([...(p.completed||[]),n])].sort((a,b)=>a-b);
  const dates=[...new Set([...(p.dates||[]),t])];
  const doneOn={...(p.doneOn||{}),[n]:t};
  const patch={completed,dates,doneOn};
  const s=currentStreak([...dates,...(p.frozen||[])]),fz=p.freezes||0;
  if(s>0&&s%7===0&&p.freezeAward!==t&&fz<3){patch.freezes=fz+1;patch.freezeAward=t;toast("You earned a streak freeze for "+s+" days in a row.")}
  celebrate(n,s);
  savePlayer(patch);
  if(S.catchup){
    const rest=missedDays(S.me);
    if(rest.length)setTimeout(()=>{if(!S.catchup)return;S.viewDay=rest[0];S.slide=1;render();S.slide=0;window.scrollTo({top:0});toast("Next up: Day "+rest[0]+". "+pl(rest.length,"day")+" left.")},1500);
    else{S.catchup=false;setTimeout(()=>{toast("You're all caught up!");render()},1500)}
  }
}

async function genDay(n){
  if(!S.sample)return;
  const force=S.redoDay===n,input=$("#readIn"),readings=input?input.value.trim():"";
  S.busy["gen"+n]=true;S.busy["genErr"+n]="";render();
  const prompt=`A group of Christian friends (mostly Catholic, some not) listens to one episode a day of "The Bible in a Year" podcast with Fr. Mike Schmitz (Ascension), which follows the Great Adventure Bible Timeline reading plan. Build the study guide for Day ${n}, which falls in the ${periodOf(n).name} period of the Bible Timeline.
${readings?`The readings for Day ${n} are: ${readings}. Use exactly these passages.`:`Use the passages assigned to Day ${n} in that plan. If you're not certain which they are, give your best guess and add "(best guess)" to the readings field.`}
Everything must come from these same readings so the pieces fit together: the recap explains what happens, the key verse is the heart of it, the map shows where it happens, and the quiz and questions test and deepen the same material.

Reply with only JSON in this shape:
{"readings":"Genesis 1-2; Psalm 19",
"recap":"3 to 4 plain sentences on what happens in today's readings",
"verse":{"ref":"Genesis 1:27","text":"the verse quoted from the World English Bible (public domain)"},
"verseWhy":"one sentence on why this verse is the key to today's reading",
"places":[{"name":"Mesopotamia","lat":33.0,"lon":44.0}],
"journey":false,
"placeWhy":"one sentence on why this place matters in today's reading",
"questions":["recall question","understanding question about what it reveals about God or how it points to Christ","probing personal question about applying it this week"],
"quiz":[{"q":"question","options":["A","B","C","D"],"answer":0,"why":"one sentence explanation"}]}
Rules: 1 to 3 places, first one most important, real coordinates; set journey true only if the reading follows travel from place to place, listing places in travel order. Exactly 5 quiz questions, 4 options each, answer is the 0-based index of the correct option, vary which index is correct, answerable from today's readings. Keep the tone warm and welcoming to Christians of any background.`;
  try{
    const r=await S.sample.json(prompt,{modelTier:"default",cache:!force});
    const quiz=(Array.isArray(r.quiz)?r.quiz:[]).filter(q=>q&&q.q&&Array.isArray(q.options)&&q.options.length>=2&&Number.isInteger(q.answer)&&q.answer>=0&&q.answer<q.options.length)
      .slice(0,5).map(q=>({q:String(q.q),options:q.options.map(String),answer:q.answer,why:String(q.why||"")}));
    if(!r||!r.recap||!Array.isArray(r.questions))throw{code:"bad"};
    const doc={readings:String(r.readings||readings||""),period:String(r.period||""),recap:String(r.recap),
      verse:r.verse&&r.verse.text?{ref:String(r.verse.ref||""),text:String(r.verse.text)}:null,verseWhy:String(r.verseWhy||""),
      places:(Array.isArray(r.places)?r.places:[]).slice(0,3).map(p=>({name:String(p.name||""),lat:+p.lat,lon:+p.lon})).filter(p=>p.name),
      journey:!!r.journey,placeWhy:String(r.placeWhy||""),questions:r.questions.slice(0,3).map(String),quiz,at:Date.now()};
    S.redoDay=null;S.busy["gen"+n]=false;
    await saveDayDoc(n,doc);
    render();
  }catch(e){
    S.busy["gen"+n]=false;
    S.busy["genErr"+n]=e&&e.code==="not_granted"?"This needs permission to ask Claude. Allow it from the page's permissions, then try again."
      :e&&e.code==="rate_limited"?"Too many requests at once. Wait a minute, then try again.":"Couldn't prepare the day. Try again.";
    render();
  }
}

async function getFeedback(n){
  const dd=S.day.doc;if(!dd||!S.sample)return;

  const qa=dd.questions.map((q,i)=>`Q${i+1}: ${q}\nAnswer: ${j.answers[i]||"(skipped)"}`).join("\n\n");
  const prompt=`You are a warm, knowledgeable Bible study partner for a friend doing "The Bible in a Year" with Fr. Mike Schmitz. Draw on Scripture and the Catholic tradition Fr. Mike teaches from, while staying welcoming to Christians of any background.
Day ${n}. Readings: ${dd.readings||"unspecified"}. Recap: ${dd.recap||""}

Their answers:

${qa}

 {name:"Early World",start:1,color:"#2BA6A4",pal:["#2BA6A4","#7FD3CF","#1C6F7A","#E9C46A"],sym:"globe"},

function periodOf(n){let p=PERIODS[0];for(const x of PERIODS)if(n>=x.start)p=x;return p}
function periodEnd(i){return PERIODS[i+1]?PERIODS[i+1].start-1:TOTAL}
function seeded(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function symbolSVG(k){
  const st=(x,y,r)=>`<path d="M${x} ${y-r}L${x+r*.3} ${y-r*.3}L${x+r} ${y}L${x+r*.3} ${y+r*.3}L${x} ${y+r}L${x-r*.3} ${y+r*.3}L${x-r} ${y}L${x-r*.3} ${y-r*.3}Z" stroke="none"/>`;
  switch(k){
    case "globe":return `<g fill="none" stroke-width="2.2"><circle r="17"/><ellipse rx="7.5" ry="17"/><path d="M-17 0H17M-14-9H14M-14 9H14"/></g>`;
    case "stars":return st(0,-4,11)+st(-13,9,6)+st(13,9,6)+st(-12,-13,4)+st(12,-13,4);
    case "waves":return `<g fill="none" stroke-width="2.6" stroke-linecap="round"><path d="M-19-9q5-6 9.5 0t9.5 0t9.5 0t9.5 0"/><path d="M-19 1q5-6 9.5 0t9.5 0t9.5 0t9.5 0"/><path d="M-19 11q5-6 9.5 0t9.5 0t9.5 0t9.5 0"/></g>`;
    case "fire":return `<path stroke="none" d="M0-20C9-8 14 0 9 11C5 19-5 19-9 11C-13 2-6-3-3-9C-2-3 1 0 3-2C5-6 3-13 0-20Z"/>`;
    case "trumpet":return `<g fill="none" stroke-width="4" stroke-linecap="round"><path d="M-17 12Q-4 10 5-2Q10-10 13-16"/></g><path stroke="none" d="M9-19L19-13L16-9L7-14Z"/>`;
    case "crown":return `<path stroke="none" d="M-18 11L-18-7L-9 3L0-13L9 3L18-7L18 11Z"/><circle cx="0" cy="-15" r="2.5" stroke="none"/>`;
    case "split":return `<path stroke="none" d="M-19 11L-19-7L-11 2L-3-12L-3 11Z"/><path stroke="none" d="M3 11L3-12L11 2L19-7L19 11Z" transform="translate(2 3) rotate(8)"/>`;
    case "harp":return `<g fill="none" stroke-width="2.6" stroke-linecap="round"><path d="M-12 16V-4C-12-12-6-16-6-16M12 16V-4C12-12 6-16 6-16M-14 14H14M-12-4H12"/><path stroke-width="1.2" d="M-6-4V14M0-4V14M6-4V14"/></g>`;
    case "temple":return `<g fill="none" stroke-width="2.4" stroke-linejoin="round"><path d="M-20-3H20L0-17Z"/><path d="M-14-3V13M-5-3V13M5-3V13M14-3V13M-19 14H19"/></g>`;
    case "menorah":return `<g fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M0 15V-8M-16-8Q-16 6 0 6Q16 6 16-8M-10-8Q-10 1 0 1Q10 1 10-8M-5-8Q-5-3 0-3Q5-3 5-8M-8 15H8"/></g>${[-16,-10,-5,0,5,10,16].map(x=>`<ellipse cx="${x}" cy="-12" rx="1.8" ry="3" stroke="none"/>`).join("")}`;
    case "star":return `<path stroke="none" d="${(()=>{let d="";for(let i=0;i<16;i++){const r=i%2?7:19,a=i*Math.PI/8-Math.PI/2;d+=(i?"L":"M")+(Math.cos(a)*r).toFixed(1)+" "+(Math.sin(a)*r).toFixed(1)}return d+"Z"})()}"/>`;
    default:return `<path stroke="none" d="M-19 3Q-7-3 0 3Q5-13 18-17Q11-7 9 1Q14 5 19 3Q9 13-4 10Q-12 10-19 3Z"/><circle cx="-11" cy="2" r="1.3" fill="#14110c" stroke="none"/>`;
  }
}
const glassCache={};
function glassSVG(p){
  if(glassCache[p.start])return glassCache[p.start];
  const rnd=seeded(p.start*7919);let panes="";const dx=34,dy=44;
  for(let i=-1;i<=16;i++)for(let j=-1;j<=8;j++){
    const cx=j*dx+(i%2?dx/2:0),cy=i*dy/2,c=p.pal[Math.floor(rnd()*3)],o=(.7+rnd()*.3).toFixed(2);
    panes+=`<polygon points="${cx},${cy-dy/2} ${cx+dx/2},${cy} ${cx},${cy+dy/2} ${cx-dx/2},${cy}" fill="${c}" fill-opacity="${o}"/>`;
  }
  const id="gl"+p.start;
  return glassCache[p.start]=`<svg viewBox="0 0 240 320" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs><radialGradient id="${id}" cx="50%" cy="28%" r="80%"><stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".4"/></radialGradient></defs>
  <rect width="240" height="320" fill="${p.pal[2]}"/>
  <g stroke="#14110c" stroke-width="2.4" stroke-linejoin="round">${panes}</g>
  <rect width="240" height="320" fill="url(#${id})"/>
  <circle cx="120" cy="66" r="33" fill="${p.pal[3]}" stroke="#14110c" stroke-width="3"/>
  <circle cx="120" cy="66" r="27" fill="#14110c" fill-opacity=".6"/>
  <g transform="translate(120 66)" fill="#F8EFD8" stroke="#F8EFD8">${symbolSVG(p.sym)}</g>
  <circle cx="120" cy="190" r="75" fill="#0d0f22" fill-opacity=".74" stroke="${p.pal[3]}" stroke-width="3"/>
  </svg>`;
}

    <button class="btn primary" id="dispDone" style="width:100%">Done</button>`;};
  openSheet(draw(),function bind(sh,m){
    const wire=()=>{
      sh.querySelectorAll("[data-th]").forEach(b=>b.onclick=()=>{try{localStorage.setItem("yow-theme",b.dataset.th)}catch(e){}sh.innerHTML=draw();wire();render()});

      $("#dispDone",sh).onclick=()=>m.remove();
    };wire();
  });
}

/* ---------- celebration ---------- */
function celebrate(n,streak){
  const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  const p=periodOf(n),cols=[p.pal[0],p.pal[1],p.pal[3],"#F2D27C"];
  let bits="";
  if(!reduce)for(let i=0;i<40;i++){const a=Math.random()*Math.PI*2,d=110+Math.random()*190;
    bits+=`<i class="${i%4===0?"g":""}" style="--x:${(Math.cos(a)*d).toFixed(0)}px;--y:${(Math.sin(a)*d+60).toFixed(0)}px;--r:${(Math.random()*600-300).toFixed(0)}deg;--c:${cols[i%4]};--d:${(Math.random()*.2).toFixed(2)}s">${i%4===0?"✝":""}</i>`}
  const lines=["Well done, good and faithful servant.","Another step through salvation history.","The Word is living and active.","Keep going. The story's getting good."];
  const el=document.createElement("div");el.className="celebrate";
  el.innerHTML=`<div class="cel-card" role="status"><p class="cel-day">Day ${n} done</p><p class="cel-msg">${streak>1?`${streak}-day streak! `:""}${lines[n%lines.length]}</p></div>${bits}`;
  document.body.appendChild(el);setTimeout(()=>el.remove(),2300);
}

/* ---------- day navigation + swipe ---------- */
function changeDay(d){
  const n=Math.min(TOTAL,Math.max(1,(S.viewDay||1)+d));if(n===S.viewDay)return;
  S.viewDay=n;S.slide=d;S.ytEdit=null;render();S.slide=0;
  const a=$(".archrow");if(a&&a.getBoundingClientRect().top<0)window.scrollTo({top:0});
}
(function(){
  let sw=null;const v=$("#view");
  v.addEventListener("touchstart",e=>{
    if(S.tab!=="today"||e.touches.length!==1)return;
    if(e.target.closest("textarea,input,.tl-bar,.tl-row,.strip-row,.opts"))return;
    sw={x:e.touches[0].clientX,y:e.touches[0].clientY,t:Date.now()};
  },{passive:true});
  v.addEventListener("touchend",e=>{
    if(!sw)return;const t=e.changedTouches[0],dx=t.clientX-sw.x,dy=t.clientY-sw.y,dt=Date.now()-sw.t;sw=null;
    if(Math.abs(dx)>60&&Math.abs(dx)>1.6*Math.abs(dy)&&dt<700)changeDay(dx<0?1:-1);
  },{passive:true});
  document.addEventListener("keydown",e=>{
    if(S.tab!=="today"||$(".modal")||e.target.closest("textarea,input"))return;
    if(e.key==="ArrowRight")changeDay(1);else if(e.key==="ArrowLeft")changeDay(-1);
  });
})();

/* ---------- sharing, install, reminders ---------- */

/* ---------- catch-up mode ---------- */
function joinedOf(p){const ds=[p.joined,...(p.dates||[])].filter(Boolean).sort();return ds[0]||today()}
function daysBetween(a,b){return Math.round((parseD(b)-parseD(a))/864e5)}
function missedDays(p){
  const exp=Math.min(TOTAL,daysBetween(joinedOf(p),today()));
  const set=new Set(p.completed||[]),out=[];for(let i=1;i<=exp;i++)if(!set.has(i))out.push(i);return out;
}
function catchupHTML(){
  if(S.readOnly||!S.me)return "";
  const miss=missedDays(S.me);
  if(!miss.length){S.catchup=false;return ""}
  const list=miss.length>6?miss.slice(0,6).join(", ")+" and "+(miss.length-6)+" more":miss.join(", ");
  if(S.catchup)return `<section class="panel catchup" aria-labelledby="cuh"><h2 id="cuh">Catch-up mode</h2>
    <p class="lede">${pl(miss.length,"day")} to go: Day ${list}. Finish each one and you'll move straight to the next.</p>
    <div class="row"><button class="btn sm" id="cuBulk" style="flex:1">Mark several done</button><button class="btn sm" id="cuStop" style="flex:1">Stop catch-up</button></div></section>`;
  return `<section class="panel catchup" aria-labelledby="cuh"><h2 id="cuh">You're ${pl(miss.length,"day")} behind</h2>
    <p class="lede">As Fr. Mike says, there's no such thing as falling behind. Missed: Day ${list}. Catch-up mode walks you through them one at a time.</p>
    <div class="row"><button class="btn primary sm" id="cuStart" style="flex:2">Start catch-up</button><button class="btn sm" id="cuBulk" style="flex:1">Already listened?</button></div></section>`;
}
function openBulk(){
  const miss=missedDays(S.me);if(!miss.length)return;
  const html=`<h2>Mark days you've already heard</h2>
  <p class="lede">Listened somewhere else? Check the days you've finished.</p>
  <div class="row"><button class="linkbtn" id="bkAll">Select all</button><button class="linkbtn" id="bkNone">Clear</button></div>
  <div class="checks">${miss.map(d=>`<label><input type="checkbox" value="${d}">Day ${d}</label>`).join("")}</div>
  <div class="row"><button class="btn" id="bkCancel" style="flex:1">Cancel</button><button class="btn primary" id="bkSave" style="flex:2" disabled>Mark 0 days done</button></div>`;
  openSheet(html,(sh,m)=>{
    const boxes=[...sh.querySelectorAll("input[type=checkbox]")],btn=$("#bkSave",sh);
    const upd=()=>{const k=boxes.filter(b=>b.checked).length;btn.disabled=!k;btn.textContent="Mark "+pl(k,"day")+" done"};
    boxes.forEach(b=>b.onchange=upd);
    $("#bkAll",sh).onclick=()=>{boxes.forEach(b=>b.checked=true);upd()};
    $("#bkNone",sh).onclick=()=>{boxes.forEach(b=>b.checked=false);upd()};
    $("#bkCancel",sh).onclick=()=>m.remove();
    btn.onclick=()=>{
      const sel=boxes.filter(b=>b.checked).map(b=>+b.value),t=today(),p=S.me;
      const doneOn={...(p.doneOn||{})};sel.forEach(d=>doneOn[d]=t);
      m.remove();
      savePlayer({completed:[...new Set([...(p.completed||[]),...sel])].sort((a,b)=>a-b),dates:[...new Set([...(p.dates||[]),t])],doneOn});
      celebrate(sel[sel.length-1],currentStreak([...(S.me.dates||[]),...(S.me.frozen||[])]));
      const rest=missedDays(S.me);
      if(!rest.length){S.catchup=false;toast("You're all caught up!")}
      else if(S.catchup){S.viewDay=rest[0];render()}
    };
  });
}

/* ---------- weekly recap ---------- */
function recapWs(){
  if(S.recapWeek===undefined)S.recapWeek=((new Date().getDay()+6)%7)<2?-1:0;
  return shift(weekStart(today()),7*S.recapWeek);
}
function fmtRange(ws){
  const a=parseD(ws),b=parseD(shift(ws,6)),m=d=>d.toLocaleDateString(undefined,{month:"short"});
  return m(a)+" "+a.getDate()+"–"+(m(a)===m(b)?"":m(b)+" ")+b.getDate();
}
function weekRecap(ws){
  const we=shift(ws,6);
  const members=Object.entries(S.players).filter(([,p])=>p&&p.name)
    .map(([id,p])=>({id,p,a:weekActivity(p,ws),st:stats(p),day:Math.min(TOTAL,nextDay(p))}))
    .sort((x,y)=>y.a.ep-x.a.ep||y.st.streak-x.st.streak||x.p.name.localeCompare(y.p.name));
  const sum=k=>members.reduce((t,m)=>t+m.a[k],0);
  const champ=members.filter(m=>m.a.qp>0).sort((x,y)=>y.a.qp-x.a.qp)[0]||null;
  const prayers=S.prayers.filter(pr=>{const d=dstr(new Date(pr.at||0));return d>=ws&&d<=we}).length;
  return{ws,members,eps:sum("ep"),refl:sum("rf"),qp:sum("qp"),champ,prayers,C:challengeFor(ws),current:ws===weekStart(today())};
}
function recapText(R){
  const L=[`Year of the Word: week of ${fmtRange(R.ws)}`,
    `Together we finished ${pl(R.eps,"episode")}${R.refl?`, wrote ${pl(R.refl,"reflection")}`:""}${R.qp?` and scored ${R.qp} quiz points`:""}.`,""];
  R.members.forEach(m=>L.push(`${m.p.name}: ${pl(m.a.ep,"episode")}, now on Day ${m.day}, ${streakTxt(m.st.streak)}`));
  L.push("");
  if(R.C.per.length>=2)L.push(`Team challenge (${R.C.ch.t.toLowerCase()}): ${R.C.prog>=1?"completed!":Math.round(R.C.prog*100)+"% of the way"+(R.current?" so far":"")}`);
  if(R.champ)L.push(`Quiz champ: ${R.champ.p.name} with ${R.champ.a.qp} points`);
  if(R.prayers)L.push(`Prayer requests shared: ${R.prayers}`);
  L.push("",`Keep going, everyone! ${APP_URL}`);
  return L.join("\n").replace(/\n{3,}/g,"\n\n");
}
function recapHTML(){
  if(S.local)return "";
  const ws=recapWs(),R=weekRecap(ws);
  return `<section class="panel" aria-labelledby="rch"><h2 id="rch">Weekly recap</h2>
    <div class="seg two"><button data-rw="0" aria-pressed="${S.recapWeek===0}">This week</button><button data-rw="-1" aria-pressed="${S.recapWeek===-1}">Last week</button></div>
    <div class="recap-text">${esc(recapText(R))}</div>
    <div class="row">${navigator.share?`<button class="btn primary sm" id="rcShare" style="flex:1">Share</button>`:""}<button class="btn sm${navigator.share?"":" primary"}" id="rcCopy" style="flex:1">Copy text</button>${S.downloads?`<button class="btn sm" id="rcImg" style="flex:1">Save image</button>`:""}</div>
  </section>`;
}
async function copyText(t,msg){
  let ok=false;try{await navigator.clipboard.writeText(t);ok=true}catch(e){}
  if(!ok){const ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{ok=document.execCommand("copy")}catch(e){}ta.remove()}
  toast(ok?msg:"Couldn't copy automatically. Press and hold the recap text to copy it.");
}
async function shareRecap(){
  const t=recapText(weekRecap(recapWs()));
  try{await navigator.share({title:"Year of the Word weekly recap",text:t})}
  catch(e){if(!e||e.name!=="AbortError")copyText(t,"Recap copied. Paste it in your group chat.")}
}
function loadImg(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
const svgURL=(svg,w,h)=>"data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg.replace("<svg ",`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" `));
const streakTxt=n=>n?n+"-day streak":"no streak yet";
async function recapPNG(R,withImgs){
  try{await document.fonts.ready}catch(e){}
  const W=1080,H=1350,c=document.createElement("canvas");c.width=W;c.height=H;const g=c.getContext("2d");
  const per=periodOf(nextDay(S.me));
  const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,"#1d2348");bg.addColorStop(1,"#0b0e20");g.fillStyle=bg;g.fillRect(0,0,W,H);
  g.strokeStyle="#D9B45F";g.lineWidth=5;g.strokeRect(34,34,W-68,H-68);
  if(withImgs){const gl=await loadImg(svgURL(glassSVG(per),240,320));if(gl){g.save();g.beginPath();g.moveTo(W-300,180);g.arc(W-200,180,100,Math.PI,0);g.lineTo(W-100,347);g.lineTo(W-300,347);g.closePath();g.clip();g.drawImage(gl,W-300,80,200,267);g.restore();g.strokeStyle="#D9B45F";g.lineWidth=4;g.beginPath();g.moveTo(W-300,347);g.lineTo(W-300,180);g.arc(W-200,180,100,Math.PI,0);g.lineTo(W-100,347);g.closePath();g.stroke()}}
  const SC="'Alegreya SC', Georgia, serif",AL="Alegreya, Georgia, serif";
  g.fillStyle="#D9B45F";g.font=`800 64px ${SC}`;g.fillText("Year of the Word",86,150);
  g.fillStyle="#EEE6D3";g.font=`500 40px ${AL}`;g.fillText("Week of "+fmtRange(R.ws),86,210);
  g.fillStyle="#F2D27C";g.font=`800 150px ${SC}`;g.fillText(String(R.eps),86,380);
  g.fillStyle="#EEE6D3";g.font=`500 38px ${AL}`;g.fillText(R.eps===1?"episode finished together":"episodes finished together",86,432);
  let y=520;const rows=R.members.slice(0,7);
  for(const m of rows){
    if(withImgs){const av=await loadImg(svgURL(avatar(m.p),80,80));if(av){g.save();g.beginPath();g.arc(126,y+40,40,0,Math.PI*2);g.clip();g.drawImage(av,86,y,80,80);g.restore()}}
    else{g.fillStyle=m.p.color||"#555";g.beginPath();g.arc(126,y+40,40,0,Math.PI*2);g.fill()}
    g.fillStyle="#FFFFFF";g.font=`700 40px ${AL}`;g.fillText(m.p.name.slice(0,22),190,y+36);
    g.fillStyle="#B8B5C9";g.font=`400 30px ${AL}`;g.fillText(`${pl(m.a.ep,"episode")}, now on Day ${m.day}, ${streakTxt(m.st.streak)}`,190,y+76);
    y+=104;
  }
  if(R.members.length>7){g.fillStyle="#B8B5C9";g.font=`400 30px ${AL}`;g.fillText(`and ${R.members.length-7} more`,190,y+20);y+=40}
  g.fillStyle="#EEE6D3";g.font=`500 32px ${AL}`;let fy=Math.max(y+40,H-210);
  if(R.C.per.length>=2){g.fillText(`Team challenge: ${R.C.prog>=1?"completed!":Math.round(R.C.prog*100)+"% of the way"}`,86,fy);fy+=48}
  if(R.champ){g.fillText(`Quiz champ: ${R.champ.p.name} (${R.champ.a.qp} points)`,86,fy);fy+=48}
  g.fillStyle="#D9B45F";g.font=`700 30px ${SC}`;g.fillText("The Bible in a Year, together",86,H-80);
  return await new Promise((res,rej)=>{try{c.toBlob(b=>b?res(b):rej(new Error("blob")),"image/png")}catch(e){rej(e)}});
}
async function saveRecapImage(){
  if(!S.downloads)return;
  const btn=$("#rcImg");if(btn){btn.disabled=true;btn.textContent="Drawing…"}
  const R=weekRecap(recapWs());let blob=null;
  try{blob=await recapPNG(R,true)}catch(e){try{blob=await recapPNG(R,false)}catch(e2){}}
  if(btn){btn.disabled=false;btn.textContent="Save image"}
  if(!blob){toast("Couldn't draw the image. Try Copy text instead.");return}
  try{await S.downloads.save({filename:"year-of-the-word-"+R.ws+".png",data:blob});toast("Recap image saved.")}
  catch(e){if(e&&e.code==="declined")return;toast("Couldn't save the image here. Try Copy text instead.")}
}

/* ---------- boot ---------- */
(async function boot(){
  const cl=window.claude;
  const use=n=>cl&&cl.use?cl.use(n).catch(()=>null):Promise.resolve(null);
  const [db,user,sample]=await Promise.all([use("db"),use("user"),use("sample")]);
  use("downloads").then(d=>{S.downloads=d;if(d&&S.tab==="fellowship")scheduleRender()});
  S.sample=sample;
  let uid=null;if(user){try{uid=await user.id()}catch(e){}}
  if(!(db&&uid))return startLocal();
  S.db=db;S.uid=uid;S.user=user;
  try{S.isOwner=await user.isOwner()}catch(e){}
  try{const w=await user.can("data.write");if(w===false)S.readOnly=true}catch(e){}
  let first=true;
  db.collection("players").onSnapshot(snap=>{
    const ps={};snap.docs.forEach(d=>{if(d.exists)ps[d.id]=d.data()});
    S.players=ps;if(ps[uid])S.me={...ps[uid]};
    if(first){first=false;S.booted=true;applyFreezes()}
    checkWeekly();
    if(!$(".modal"))scheduleRender();
  },()=>{if(!S.booted)startLocal()});
  db.collection("prayers").orderBy("at","desc").limit(60).onSnapshot(s=>{S.prayers=s.docs.map(d=>({id:d.id,...d.data()}));if(S.tab==="prayer")scheduleRender()},()=>{});
  db.collection("reactions").where("scope","==","prayers").onSnapshot(s=>{S.prayRx=s.docs.map(d=>({id:d.id,...d.data()}));if(S.tab==="prayer")scheduleRender()},()=>{});
  db.collection("reactions").where("scope","==","cheer:"+today()).onSnapshot(s=>{S.cheers=s.docs.map(d=>({id:d.id,...d.data()}));scheduleRender()},()=>{});
})();
function startLocal(){
  S.local=true;S.uid="me";S.me=lsGet("yow-me");
  if(S.me)S.players={me:S.me};
  S.booted=true;applyFreezes();render();
}
